<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Transmission Line</title>
    <style>
       @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

       .page-header {
            width: 100%;
            text-align: center;
            margin-bottom: 2rem;
            padding: 1rem 0;
            background: linear-gradient(135deg, #000000 0%, #151516 100%);
            border-bottom: 2px solid #4df0f9;
        }

        .page-header h1 {
            color: #4df0f9;
            font-size: 2rem;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 0 0 8px rgba(77, 240, 249, 0.3);
        }

        .title-icon {
            font-size: 1.8rem;
            animation: iconPulse 2.5s ease-in-out infinite;
        }
       .control-panel {
            background: #000000;
            padding: 1.5rem;
            border-radius: 1.2rem;
            box-shadow: 0 0 20px rgba(77, 240, 249, 0.15);
            width: 90%;
            max-width: calc(100% - 100px);
            margin: 0 auto 2rem;
            transition: all 0.3s ease;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            align-items: start;
        }

        .control-section {
            background: #151516;
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid #363638;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .combined-config .slider-container {
            margin-bottom: 1.5rem;
        }

        .config-group {
            gap: 1.2rem;
        }
        .control-section h3 {
            text-align: center;
            justify-content: center;
            margin-left: -0.5rem;
        }

        .control-section .icon-animated {
            margin-right: 8px;
            margin-left: 0;
        }

        .metric .label,
        .metric .value {
            text-align: center;
            display: block;
            width: 100%;
        }
        .control-section:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(77, 240, 249, 0.2);
        }

        .summary-grid {
            display: grid;
            gap: 1rem;
            margin-top: 1.2rem;
            grid-template-columns: repeat(3, minmax(120px, 1fr));
            justify-content: center;
        }

        .metric:nth-child(4),
        .metric:nth-child(5) {
            grid-column: span 1;
        }
        @media (max-width: 480px) {
            .summary-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .summary-grid {
                grid-template-columns: repeat(2, minmax(120px, 1fr));
            }
        }
        .metric {
            background: #3a3a3d;
            padding: 1rem;
            border-radius: 0.8rem;
            text-align: center;
            border: 1px solid #4a4a4d;
        }

        .metric.highlight {
            background: linear-gradient(135deg, #4a00e0aa, #8e2de2aa);
            border-color: #4df0f9;
        }

        .metric .value {
            display: block;
            font-size: 1.4rem;
            font-weight: 600;
            color: #4df0f9;
            margin: 0.3rem 0;
        }

        .metric .unit {
            font-size: 0.9rem;
            color: #aaa;
        }

        .metric .label {
            font-size: 0.95rem;
            color: #ccc;
            display: block;
            margin-bottom: 0.2rem;
        }

        .input-group {
            display: grid;
            gap: 1rem;
        }

        .input-group label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem;
            background: #3a3a3a;
            border-radius: 0.8rem;
            transition: background 0.3s ease;
        }

        .input-group label:hover {
            background: #434346;
        }

        .input-group input[type="number"] {
            background: none;
            border: none;
            color: #4df0f9;
            font-weight: 600;
            width: 80px;
            text-align: right;
            padding: 0.3rem 0.5rem;
            border-bottom: 2px solid #4a4a4d;
            transition: border-color 0.3s ease;
        }

        .input-group input[type="number"]:focus {
            border-color: #4df0f9;
            outline: none;
        }

        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 200px;
            margin-bottom: 1.5rem;
        }

        .input-group label {
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.6rem;
            background: #3a3a3a;
            color: #fff;
            border-radius: 0.5rem;
            border: none;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
        }

        .slider-container label {
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .slider-container input[type="range"] {
            width: 100%;
        }

        #resultsPanel {
            background: #2a2a2a;
            padding: 1.5rem;
            border-radius: 1rem;
            width: 100%;
            max-width: 1000px;
            margin-top: 2rem;
        }

        #resultsPanel h3 {
            color: #79ffe1;
            margin-bottom: 1rem;
        }

        #resultsPanel p {
            margin: 0.5rem 0;
        }

        input[type="number"] {
            width: auto;
            max-width: 80px;
            margin-left: 10px;
        }

        .min-max {
            display: flex;
            justify-content: space-between;
            font-size: 0.75em;
            color: #aaa;
            margin-bottom: 5px;
        }

       body {
            font-family: 'Poppins', sans-serif;
            background: url('background.jpg') no-repeat center center fixed;
            background-size: cover;       
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            padding-top: 0;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s ease;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 13, 13, 0.6); 
            z-index: -1;
        }

        .controls {
            background: #000000;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(77, 240, 249, 0.15);
            width: 90%;
            max-width: 800px;
            margin-bottom: 30px;
            transition: box-shadow 0.3s ease;
        }

        .diagram-container {
            background: #040404;
            border-radius: 12px;
            overflow: hidden;
            
            box-shadow: 0 0 30px rgba(77, 240, 249, 0.15);
            width: 100%;
            height: 400px;
            position: relative;
            transition: box-shadow 0.3s ease;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        .load-controls {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 25px;
            justify-content: center;
            background: #000000;
            padding: 1.5rem;
            border-radius: 1.2rem;
            box-shadow: 0 0 20px rgba(77, 240, 249, 0.15);
            transition: all 0.3s ease;
        }

        .load-input-group {
            background: #151516;
            border: 1px solid #363638;
            padding: 20px;
            border-radius: 10px;
            min-width: 250px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }

        .load-input-group:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(77, 240, 249, 0.2);
        }

        .slider-container label {
            display: flex;
            justify-content: space-between;
            margin-top: 0;
            margin-bottom: 5px;
            align-items: center;
            font-weight: 500;
        }

        .slider-container .min-max {
            display: flex;
            justify-content: space-between;
            font-size: 0.75em;
            color: #aaa;
            margin-bottom: 5px;
        }

        .current-value {
            font-weight: bold;
            color: #4df0f9;
            transition: color 0.3s ease;
        }

        input[type="range"] {
            width: 100%;
            margin-bottom: 0.5rem;
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            background: linear-gradient(to right, #4a00e0, #8e2de2);
            border-radius: 4px;
            opacity: 0.9;
            transition: background 0.3s ease;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            background: #fff;
            border: 2px solid #8e2de2;
            border-radius: 50%;
            margin-top: -5px;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: #8e2de2;
            transform: scale(1.1);
        }

        input[type="number"] {
            background: #111;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            padding: 6px 10px;
            width: 70px;
            margin-left: 5px;
            transition: border-color 0.3s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #4df0f9;
        }

        .tooltip {
            position: absolute;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 10px;
            border-radius: 6px;
            pointer-events: none;
            display: none;
            border: 1px solid #4df0f9;
            box-shadow: 0 0 12px rgba(77, 240, 249, 0.4);
            z-index: 100;
            max-width: 200px;
        }

        .tooltip h4 {
            margin: 0 0 5px 0;
            color: #4df0f9;
            font-size: 1em;
        }

        .tooltip p {
            margin: 3px 0;
            font-size: 0.9em;
        }

        .section-header::before {
            content: "\26A1 ";
            color: #ffdc00;
            font-size: 1.2em;
            margin-right: 5px;
        }

        [data-pf] .current-value {
            color: var(--pf-color, #4df0f9);
            transition: color 0.3s ease;
        }

        @keyframes iconPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.15);
                opacity: 0.85;
            }
        }

        .icon-animated {
            display: inline-block;
            animation: iconPulse 2.5s ease-in-out infinite;
            margin-right: 6px;
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 4px #4df0f9;
            }
            50% {
                text-shadow: 0 0 12px #4df0f9;
            }
        }

        h3 {
            display: flex;
            align-items: center;
            font-size: 1.1em;
            animation: glow 3s infinite ease-in-out;
        }

        .diagram-title {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .diagram-title h3 {
            color: #4df0f9;
            margin: 0;
            font-size: 1.4rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(28, 28, 30, 0.9);
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid #4df0f966;
            backdrop-filter: blur(4px);
        }

        .diagram-title .icon-animated {
            font-size: 1.2em;
            animation: iconPulse 2.5s ease-in-out infinite;
        }

        input[type="range"],
        input[type="number"] {
            transition: all 0.3s ease;
        }

        .load-input-group,
        canvas,
        .tooltip {
            transition: all 0.4s ease;
        }

        .tooltip {
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .tooltip.show {
            opacity: 1;
            transform: translateY(0);
        }

        .load-power-input,
        .load-pf-input {
            background: #111;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            padding: 6px 10px;
            width: 70px;
            margin-left: 5px;
            transition: border-color 0.3s ease;
        }

        .load-power-input:focus,
        .load-pf-input:focus {
            outline: none;
            border-color: #4df0f9;
        }

    </style>
    
</head>
<body>
    <div class="overlay"></div>
    <div class="page-header">
        <h1><span class="title-icon">⚡</span> Transmission Line Power Factor Correction Simulator</h1>
    </div>

    <div class="control-panel">
        <div class="controls-grid">
            <div class="control-section combined-config">
                <div class="config-column">
                    <h3><span class="icon-animated">⚙️</span>Configuration & Parameters</h3>
                    <div class="config-group">
                        <div class="slider-container">
                            <label>
                                <span class="icon-animated">🔢</span>Number of Loads: 
                                <span class="current-value" id="loadCountValue">3</span>
                            </label>
                            <div class="min-max">
                                <span>1</span>
                                <span>10</span>
                            </div>
                            <input type="range" id="loadCount" min="1" max="10" value="3">
                        </div>
                        
                        <div class="input-group">
                            <label>
                                <span class="icon-animated">⚡</span>Voltage (V)
                                <input type="number" id="voltage" value="230" min="66" step="1">
                            </label>
                            <label>
                                <span class="icon-animated">🔄</span>Frequency (Hz)
                                <input type="number" id="frequency" value="50" min="50" max="60" step="1">
                            </label>
                            <label>
                                <span class="icon-animated">🎯</span>Target PF
                                <input type="number" id="requiredPF" value="0.95" min="0.2" max="1" step="0.01">
                            </label>
                        </div>
                    </div>
                </div>
            </div>
    
            <div class="control-section results">
                <h3><span class="icon-animated">📊</span>System Summary</h3>
                <div class="summary-grid">
                    <div class="metric">
                        <span class="label">Real Power</span>
                        <span class="value" id="totalP">0</span>
                        <span class="unit">kW</span>
                    </div>
                    <div class="metric">
                        <span class="label">Reactive Power</span>
                        <span class="value" id="totalQ">0</span>
                        <span class="unit">kVAR</span>
                    </div>
                    <div class="metric">
                        <span class="label">Current PF</span>
                        <span class="value" id="currentPF">0.00</span>
                    </div>
                    <div class="metric highlight">
                        <span class="label">Required kVAR</span>
                        <span class="value" id="requiredQ">0</span>
                        <span class="unit">kVAR</span>
                    </div>
                    <div class="metric highlight">
                        <span class="label">Capacitance</span>
                        <span class="value" id="requiredC">0</span>
                        <span class="unit">µF</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="diagram-container">
        <div class="diagram-title">
            <h3><span class="icon-animated">📏</span> Single Line Diagram</h3>
        </div>
        <canvas id="mainCanvas"></canvas>
        <div class="tooltip" id="tooltip"></div>
    </div>

    <div class="load-controls" id="loadControls"></div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        let loads = [];
        let activeLoadIndex = -1;
        let animationOffset = 0;
        let glowPulse = 0;

        function initCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        
        function drawAnimatedLine() {
            const midY = canvas.height / 2;
            const lineLength = canvas.width - 100;

            ctx.beginPath();
            ctx.moveTo(50, midY);
            ctx.lineTo(canvas.width - 50, midY);
            ctx.strokeStyle = '#00d4e6';
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        function drawAnimatedWaveform() {
            const midY = canvas.height / 2;
            const amplitude = 8;
            const wavelength = 80;
            const speed = -1.2;

            const startX = 50; 
            const loadX = canvas.width - 50; 
            const sineOffset = 0.5 + 0.5 * Math.sin((animationOffset) / 20);
            
            const gradient = ctx.createLinearGradient(50, midY, canvas.width - 50, midY);
            gradient.addColorStop(0, '#00f9ff');
            gradient.addColorStop(sineOffset, '#ff00cc');
            gradient.addColorStop(1, '#00f9ff');

            ctx.beginPath();
            ctx.lineWidth = 2;
            ctx.strokeStyle = gradient;

            for (let x = startX; x <= loadX; x++) {
                const y = midY + amplitude * Math.sin((x + (animationOffset - 3) * speed) / wavelength * 2 * Math.PI);
                if (x === startX) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
        }

        function drawTransmissionLine() {
            const midY = canvas.height / 2;
            const voltage = document.getElementById('voltage').value;
            ctx.fillStyle = '#4df0f9';
            
            const maxVoltage = 12000; 
            const targetVoltage = 230;
            const maxHue = 190; 
            
            const voltageProportion = voltage / maxVoltage;
            const hue = ((voltage / targetVoltage) * maxHue) % 360;
            const glowStrength = 10 + 5 * Math.sin(glowPulse / 10); 

            ctx.beginPath();
            ctx.moveTo(50, midY - 100);
            ctx.lineTo(50, midY + 100);
            ctx.strokeStyle = `hsl(${hue}, 80%, 50%)`;
            ctx.lineWidth = 4;
            ctx.shadowColor = '#4df0f9';
            ctx.shadowBlur = glowStrength;
            ctx.stroke();

            ctx.shadowBlur = 0;
            
            ctx.fillStyle = '#4df0f9';
            ctx.font = '14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`${voltage} V`, 50, midY + 120);
        }

        function drawLoadLine(x, power) {
            const midY = canvas.height / 2;
            const loadY = midY + 100;

            const gradient = ctx.createLinearGradient(x, midY, x, loadY);
            gradient.addColorStop(0, '#4df0f9');     
            gradient.addColorStop(0.5 + 0.5 * Math.sin((animationOffset - 2) / 20), '#8e2de2');
            gradient.addColorStop(1, '#4df0f9');   

            ctx.beginPath();
            ctx.moveTo(x, midY);
            ctx.lineTo(x, loadY);
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 4;
            ctx.stroke();
        }
        
        function drawLoad(x, power, pf, index) {
            ctx.beginPath();
            ctx.moveTo(x, canvas.height/2);
            ctx.lineTo(x, canvas.height/2 + 80);
            ctx.strokeStyle = `hsl(${(1 - pf) * 120}, 80%, 50%)`;
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(x, canvas.height/2 + 100 + ( power / 1000 ), 15 + ( power / 1000 ), 0, Math.PI * 2);
            ctx.fillStyle = index === activeLoadIndex ? `hsl(${(1 - pf) * 120}, 80%, 75%)` : `hsl(${(1 - pf) * 120}, 80%, 50%)`;
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`${power}kW`, x, canvas.height/2 + 130 + ( power / 500 ));
        }

        function updateDiagram() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTransmissionLine();
            drawAnimatedLine();
            drawAnimatedWaveform();
            
            const spacing = (canvas.width - 100) / (loads.length + 1);
            loads.forEach((load, i) => {
                const x = 50 + spacing * (i + 1);
                drawLoadLine(x, load.power);
                drawLoad(x, load.power, load.pf, i);
            });
        }

        function updateSystemSummary() {
            const requiredPF = parseFloat(document.getElementById('requiredPF').value);
            const voltage = parseFloat(document.getElementById('voltage').value);
            const frequency = parseFloat(document.getElementById('frequency').value);

            let totalP = 0;
            let totalQ = 0;

            loads.forEach(load => {
                totalP += load.power;
                totalQ += load.power * Math.tan(Math.acos(load.pf));
            });

            const apparentPower = Math.sqrt(totalP**2 + totalQ**2);
            const currentPF = totalP / apparentPower;

            const targetQ = totalP * Math.tan(Math.acos(requiredPF));
            const requiredQ = Math.abs(totalQ - targetQ);

            const C = (requiredQ * 1000 * 1000000) / (2 * Math.PI * frequency * ((voltage)**2));

            document.getElementById('totalP').textContent = totalP.toFixed(2);
            document.getElementById('totalQ').textContent = totalQ.toFixed(2);
            document.getElementById('currentPF').textContent = currentPF.toFixed(3);
            document.getElementById('requiredQ').textContent = requiredQ.toFixed(2);
            document.getElementById('requiredC').textContent = C.toFixed(2);
        }

        function createLoadControls() {
            const container = document.getElementById('loadControls');
            container.innerHTML = '';

            loads.forEach((load, i) => {
                const div = document.createElement('div');
                div.className = 'load-input-group';
                div.innerHTML = `
                    <h3><span class="icon-animated">⚡</span>Load ${i+1}</h3>
                    <div class="slider-container">
                        <label>
                            Power (kW):
                            <input type="number" class="load-power-input" 
                                min="1" max="10000" step="1" 
                                value="${load.power}" data-index="${i}">
                        </label>
                        <div class="min-max">
                            <span>1</span>
                            <span>10000</span>
                        </div>
                        <input type="range" class="load-power" 
                            min="1" max="10000" value="${load.power}" 
                            data-index="${i}">
                    </div>
                    <div class="slider-container">
                        <label>
                            Power Factor (Lag):
                            <input type="number" class="load-pf-input" 
                                min="0.2" max="1" step="0.01" 
                                value="${load.pf.toFixed(2)}" 
                                data-index="${i}">
                        </label>
                        <div class="min-max">
                            <span>0.2</span>
                            <span>1.0</span>
                        </div>
                        <input type="range" class="load-pf" 
                            min="0.2" max="1" step="0.01" 
                            value="${load.pf}" data-index="${i}">
                    </div>
                `;
                container.appendChild(div);
            });

            document.querySelectorAll('.load-power').forEach(input => {
            input.addEventListener('input', function() {
                const index = this.dataset.index;
                const value = parseFloat(this.value);
                loads[index].power = value;
                document.querySelector(`.load-power-input[data-index="${index}"]`).value = value;
                updateDiagram();
                updateSystemSummary();
            });
        });

            document.querySelectorAll('.load-power-input').forEach(input => {
                input.addEventListener('input', function() {
                    const index = this.dataset.index;
                    const value = Math.min(10000, Math.max(1, parseFloat(this.value) || 1));
                    this.value = value;
                    loads[index].power = value;
                    document.querySelector(`.load-power[data-index="${index}"]`).value = value;
                    updateDiagram();
                    updateSystemSummary();
                });
            });

            document.querySelectorAll('.load-pf').forEach(input => {
                input.addEventListener('input', function() {
                    const index = this.dataset.index;
                    const value = parseFloat(this.value);
                    loads[index].pf = value;
                    document.querySelector(`.load-pf-input[data-index="${index}"]`).value = value.toFixed(2);
                    updateDiagram();
                    updateSystemSummary();
                });
            });

            document.querySelectorAll('.load-pf-input').forEach(input => {
                input.addEventListener('input', function() {
                    const index = this.dataset.index;
                    let value = parseFloat(this.value) || 0.7; 
                    value = Math.min(1, Math.max(0.01, value)); 
                    this.value = value.toFixed(2);
                    loads[index].pf = value;
                    document.querySelector(`.load-pf[data-index="${index}"]`).value = value;
                    updateDiagram();
                    updateSystemSummary();
                });
            });
        }

        document.getElementById('loadCount').addEventListener('input', function() {
            const count = parseInt(this.value);
            const previousCount = loads.length;

            if (count > previousCount) {
                for (let i = previousCount; i < count; i++) {
                    loads.push({ power: 50, pf: 0.95 });
                }
            } else {
                loads.length = count;
            }
            
            document.getElementById('loadCountValue').textContent = count; 
            createLoadControls();
            updateDiagram();
            updateSystemSummary();
            document.getElementById('requiredPF').addEventListener('input', updateSystemSummary);

        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const spacing = (canvas.width - 100) / (loads.length + 1);
            document.getElementById('voltage').addEventListener('input', () => {
            updateDiagram();
            updateSystemSummary();
            document.getElementById('requiredPF').addEventListener('input', updateSystemSummary);
        });

            let found = false;
            let newActiveIndex = -1;
            let tooltipHTML = '';
            let tooltipX = e.clientX + 20;
            let tooltipY = -e.clientY/4 +300;

            loads.forEach((load, i) => {
                const loadX = 50 + spacing * (i + 1);
                const distance = Math.sqrt((x - loadX)**2 + (y - (canvas.height/2 + 100))**2);

                if(distance < 20) {
                    found = true;
                    newActiveIndex = i;
                    
                    tooltipHTML = `
                        <h4>Load ${i+1}</h4>
                        <p><strong>Power:</strong> ${load.power} kW</p>
                        <p><strong>PF:</strong> ${load.pf.toFixed(2)}</p>
                    `;
                }
            });

            const tooltip = document.getElementById('tooltip');
            if (found) {
                activeLoadIndex = newActiveIndex;
                tooltip.innerHTML = tooltipHTML;
                tooltip.classList.add('show');
                tooltip.style.display = 'block';
                tooltip.style.left = `${tooltipX}px`;
                tooltip.style.top = `${tooltipY}px`;
            } 
            
            else if (activeLoadIndex !== -1) {
                activeLoadIndex = -1;
                tooltip.classList.remove('show');
                setTimeout(() => {
                tooltip.style.display = 'none';
                }, 300);
            }

            updateDiagram();
            updateSystemSummary();

        });

        canvas.addEventListener('mouseleave', () => {
            activeLoadIndex = -1;
            document.getElementById('tooltip').style.display = 'none';
            updateDiagram();
            updateSystemSummary();  
        });

        initCanvas();
        window.addEventListener('resize', initCanvas);
        document.getElementById('requiredPF').addEventListener('input', updateSystemSummary);
        document.getElementById('loadCount').dispatchEvent(new Event('input'));

        function animate() {
            const frequency = document.getElementById('frequency').value;
            animationOffset += 4 * (frequency / 50);
            glowPulse += 1;
            updateDiagram();
            requestAnimationFrame(animate);
        }

        initCanvas();
        animate();
    </script>
</body>
</html>
